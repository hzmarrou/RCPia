name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Deliberately has no `services:` block, and that is the point of the job rather than an
  # oversight. The corpus decisions are checked against committed data alone -- rule files,
  # section fixtures, routing baselines, coverage and specs -- with no database, no reference
  # library and no network. The API job below would pass these tests too; this one proves they
  # do not quietly acquire a dependency, and gives a corpus-only change an answer in seconds
  # instead of waiting on PostgreSQL and the full suite.
  #
  # What fails here: a rule that is dead, shadowed or ambiguous; a rule file that no longer
  # reproduces its baseline; a document in scope with no rule file, or a rule file for a
  # document nobody curated; a document excluded with no reason stated; a specialist source
  # claiming it may hold a position on treatment.
  corpus:
    name: Corpus (no database)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    env:
      # Unreachable on purpose. A corpus test that starts needing a database fails here rather
      # than passing quietly because CI happened to provide one.
      DATABASE_URL: postgresql+psycopg://nobody:nobody@127.0.0.1:1/none
      TEST_DATABASE_URL: postgresql+psycopg://nobody:nobody@127.0.0.1:1/none
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Validate the corpus decisions
        run: uv run pytest tests/test_corpus_*.py -q

  api:
    name: API (uv)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    services:
      # Same image as local development: the standard postgres image has no pgvector.
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: rcpia
          POSTGRES_PASSWORD: rcpia
          POSTGRES_DB: rcpia
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rcpia -d rcpia"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql+psycopg://rcpia:rcpia@localhost:5432/rcpia_test
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Lint
        run: uv run ruff check .

      - name: Typecheck
        run: uv run mypy rcpia

      - name: Test
        run: uv run pytest

  web:
    name: Web (pnpm)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build
        env:
          NEXT_OUTPUT: standalone
