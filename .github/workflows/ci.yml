name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    name: API (uv)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    services:
      # Same image as local development: the standard postgres image has no pgvector.
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: rcpia
          POSTGRES_PASSWORD: rcpia
          POSTGRES_DB: rcpia
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rcpia -d rcpia"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql+psycopg://rcpia:rcpia@localhost:5432/rcpia_test
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Lint
        run: uv run ruff check .

      - name: Typecheck
        run: uv run mypy rcpia

      - name: Test
        run: uv run pytest

  web:
    name: Web (pnpm)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build
        env:
          NEXT_OUTPUT: standalone
