# RCPia v1 local runtime.
#
# Run from the repository root:
#     docker compose --env-file .env -f infra/docker-compose.yml up --build --scale rcpia-worker=3
#
# `--env-file .env` is required. Compose reads the environment file next to *this* file
# (`infra/.env`), and the project keeps `.env` at the repository root -- so without the flag every
# `${...}` below silently takes its default: no credentials, no parser key, no feed proxy. The
# stack starts anyway and the workers then refuse to run agents, with nothing saying why.
#
# `--build` after a code change. `up` alone reuses the existing image, and a stale API image is
# healthy, answers /health, and serves the routes it was built with -- a missing endpoint is the
# symptom.
#
# Specialists run concurrently by running several workers, not by running several agents inside
# one. Each worker claims one job at a time; the queue's `FOR UPDATE SKIP LOCKED` guarantees no
# two workers ever get the same one. To change how many run at once:
#
#     docker compose -f infra/docker-compose.yml up --scale rcpia-worker=3
#
# or set WORKER_REPLICAS in the environment. The default of 3 matches a panel of three
# specialists, so one panel runs fully in parallel on a laptop.
#
# **Scale it to your model provider, not to your CPU.** Every worker holds one Pi process, and
# each Pi run is one concurrent request against Azure OpenAI. No limit is assumed here: check
# the deployment's own concurrent-request and tokens-per-minute quota and keep the replica
# count below it, or the extra workers will turn a queue into a wall of 429s.
name: rcpia

services:
  postgres:
    # pgvector image, not plain postgres:16 — the standard image lacks the extension.
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: rcpia
      POSTGRES_PASSWORD: rcpia
      POSTGRES_DB: rcpia
    ports:
      # Override POSTGRES_PORT if another PostgreSQL already owns 5432 on the host.
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rcpia -d rcpia"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: ../apps/api
      args:
        UV_DEFAULT_INDEX: ${UV_DEFAULT_INDEX:-https://pypi.org/simple}
    environment:
      APP_ENV: local
      DATABASE_URL: postgresql+psycopg://rcpia:rcpia@postgres:5432/rcpia
      BLOB_PROVIDER: local
      LOCAL_BLOB_ROOT: /data/blobs
      PARSER_PROVIDER: llamaparse
      LLAMAPARSE_API_KEY: ${LLAMAPARSE_API_KEY:-}
      PI_BIN: pi
      AGENTS_ROOT: /app/agents
      AUTH_SECRET: ${AUTH_SECRET:-change-me}
    ports:
      - "8000:8000"
    volumes:
      - ../data/blobs:/data/blobs
      - ../agents:/app/agents:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - python -c "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status==200 else 1)"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  # The job worker. Same code as the API, plus Node and the pinned Pi runtime, because this is
  # the process that actually runs an agent.
  rcpia-worker:
    build:
      # The repository root, not apps/api: the image installs the agent runtime from the
      # pinned package.json that lives there.
      context: ..
      dockerfile: apps/api/Dockerfile.worker
      args:
        UV_DEFAULT_INDEX: ${UV_DEFAULT_INDEX:-https://pypi.org/simple}
        NPM_CONFIG_REGISTRY: ${NPM_CONFIG_REGISTRY:-https://registry.npmjs.org/}
    environment:
      APP_ENV: local
      DATABASE_URL: postgresql+psycopg://rcpia:rcpia@postgres:5432/rcpia
      BLOB_PROVIDER: local
      LOCAL_BLOB_ROOT: /data/blobs
      PARSER_PROVIDER: llamaparse
      LLAMAPARSE_API_KEY: ${LLAMAPARSE_API_KEY:-}
      AGENTS_ROOT: /app/agents
      # Pi task and session files are named case-role-run, so several workers writing into one
      # volume never collide. Sharing it is what makes the session log of every run readable
      # from one place afterwards.
      PI_WORK_ROOT: /data/pi-work
      AUTH_SECRET: ${AUTH_SECRET:-change-me}
      AZURE_OPENAI_BASE_URL: ${AZURE_OPENAI_BASE_URL:-}
      AZURE_OPENAI_API_KEY: ${AZURE_OPENAI_API_KEY:-}
      AZURE_OPENAI_EMBEDDING_DEPLOYMENT: ${AZURE_OPENAI_EMBEDDING_DEPLOYMENT:-}
      AZURE_RERANK_BASE_URL: ${AZURE_RERANK_BASE_URL:-}
      # Optional: restrict this worker to some job types, e.g. "run_agent" for a pool sized to
      # the model provider's limit, alongside a cheaper pool doing parsing and extraction.
      WORKER_JOB_TYPES: ${WORKER_JOB_TYPES:-}
      # Which specialists a settled ledger version convenes on its own. Empty turns automatic
      # analysis off; the default spends three agent runs on every eligible upload. Passed
      # through explicitly, or an operator setting it in .env would find it had no effect here.
      AUTO_PANEL_ROLES: ${AUTO_PANEL_ROLES:-}
    volumes:
      - ../data/blobs:/data/blobs
      - ../data/pi-work:/data/pi-work
      - ../agents:/app/agents:ro
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      # Overridden by `--scale rcpia-worker=N`.
      replicas: ${WORKER_REPLICAS:-3}
    restart: unless-stopped

  web:
    build:
      context: ../apps/web
      args:
        NPM_CONFIG_REGISTRY: ${NPM_CONFIG_REGISTRY:-https://registry.npmjs.org/}
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
      API_INTERNAL_BASE_URL: http://api:8000
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  postgres_data:
