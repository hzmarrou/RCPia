[project]
name = "rcpia-api"
version = "0.1.0"
description = "RCPia v1 backend: dossier intake, case ledger, Pi agent runtime, provisional PPS generation."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0",
    "asyncpg>=0.30",
    "psycopg[binary]>=3.2",
    "alembic>=1.14",
    "pydantic[email]>=2.9",
    "pydantic-settings>=2.6",
    "python-multipart>=0.0.12",
    "argon2-cffi>=25.1.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
# Only needed when BLOB_PROVIDER=azure. A local or on-premises deployment does not
# install it, which is why the adapter imports the SDK lazily.
# The [aio] extra pulls in aiohttp; without it the async client raises ImportError at
# construction time, so the plain package is not enough for this adapter.
azure = ["azure-storage-blob[aio]>=12.23"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.8",
    "mypy>=1.13",
    "pytest-xdist>=3.8.0",
    "azure-storage-blob[aio]>=12.30.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["rcpia"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Alembic writes migrations with long generated lines; leave them as emitted.
"alembic/versions/*.py" = ["E501"]

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
